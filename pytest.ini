[pytest]
addopts =
    --headed
    -v
    --tb=short
markers =
    scenario1:   Scenario 1 - Functional parity
    scenario2:   Scenario 2 - Number matching
    cat_a:       Category A - Sheet/Page existence
    cat_b:       Category B - Visual existence
    cat_c:       Category C - Filter existence
    cat_d:       Category D - Filter impact propagation
    cat_e:       Category E - Navigation and button functionality
    cat_f:       Category F - Cross-filter behavior
    cat_g:       Category G - Filter clear and state isolation

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

norecursedirs = .venv venv .git __pycache__ .pytest_cache

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
